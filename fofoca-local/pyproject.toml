[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "fofoca-local"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Explicit remote NAV access and the Rust-owned local backtest engine"
readme = "README.md"

[tool.maturin]
python-source = "python"
python-packages = ["fofoca_local", "fofoca_engine"]
module-name = "fofoca_local._native"
features = ["python"]
