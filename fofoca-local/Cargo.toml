[workspace]
members = [".", "data", "../fofoca-engine"]
resolver = "3"

[workspace.dependencies]
snafu = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
pyo3 = "=0.30.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fofoca-engine = { path = "../fofoca-engine" }
fofoca-local-data = { path = "data" }

[package]
name = "fofoca-local"
version = "0.1.0"
edition = "2024"

[lib]
name = "_native"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "fofoca-engine/python"]

[dependencies]
fofoca-engine.workspace = true
fofoca-local-data.workspace = true
pyo3 = { workspace = true, optional = true }
