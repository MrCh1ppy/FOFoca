[package]
name = "fofoca-api"
version = "0.1.0"
edition = "2024"
description = "Authenticated read-only HTTP API for stored FOFoca fund NAV data"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
snafu = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
subtle = "2.5"
sha2 = "0.10"
tower = { version = "0.5", features = ["util", "make"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
