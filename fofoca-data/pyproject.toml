[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fofoca-data"
version = "0.1.0"
description = "One-off historical NAV backfill for eligible off-exchange, non-money-market Chinese mutual funds (AKShare -> dedicated PostgreSQL)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "akshare==1.18.97",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
fofoca-data = "fofoca_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fofoca_data = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
