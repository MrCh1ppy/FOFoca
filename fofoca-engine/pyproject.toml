[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "fofoca-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Typed Python access to the memory-only Rust backtest skeleton"
readme = "README.md"

[tool.maturin]
python-source = "python"
module-name = "fofoca_engine._native"
features = ["python"]
