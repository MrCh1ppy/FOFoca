[package]
name = "fofoca-engine"
version = "0.1.0"
edition = "2024"
workspace = "../fofoca-local"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
snafu.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
pyo3 = { workspace = true, optional = true }
